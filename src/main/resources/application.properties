spring.application.name=fin_app_back
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finApp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
finapp.chat.nvidia.api-key=${NVIDIA_API_KEY:}
finapp.chat.nvidia.model=${NVIDIA_MODEL:mistralai/mistral-large-4-1t-a52b}
finapp.chat.nvidia.url=${NVIDIA_API_URL:https://integrate.api.nvidia.com/v1/chat/completions}
finapp.chat.tavily.api-key=${TAVILY_API_KEY:}
finapp.chat.tavily.url=${TAVILY_API_URL:https://api.tavily.com/search}
finapp.cors.allowed-origins=${WEB_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500}
finapp.jwt.secret=${FINAPP_JWT_SECRET:}
finapp.jwt.expiration-seconds=${FINAPP_JWT_EXPIRATION_SECONDS:28800}
finapp.jwt.cookie-secure=${FINAPP_JWT_COOKIE_SECURE:true}
finapp.google.client-id=${GOOGLE_CLIENT_ID:}
finapp.google.client-secret=${GOOGLE_CLIENT_SECRET:}
finapp.google.auth-redirect-uri=${GOOGLE_AUTH_REDIRECT_URI:http://localhost:8081/api/auth/google/callback}
finapp.web.base-url=${WEB_APP_URL:http://localhost:5173}
finapp.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
finapp.telegram.bot-name=${NOMBRE_BOT_TELEGRAM:}
finapp.telegram.poll-timeout-seconds=${TELEGRAM_POLL_TIMEOUT_SECONDS:5}
finapp.telegram.poll-delay-ms=${TELEGRAM_POLL_DELAY_MS:1000}
finapp.google.credentials-file=${GOOGLE_OAUTH_CREDENTIALS_FILE:client_secret_2_1064872593009-3arpd7098fqkrutcp5ut8pr2i7225jbk.apps.googleusercontent.com.json}
finapp.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
finapp.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
finapp.almacenamiento.cipher-secret=${FINAPP_ALMACENAMIENTO_CIPHER_SECRET:}
finapp.google.pubsub.topic=${GOOGLE_PUBSUB_TOPIC:}
finapp.google.pubsub.audience=${GOOGLE_PUBSUB_AUDIENCE:}
finapp.google.pubsub.service-account=${GOOGLE_PUBSUB_SERVICE_ACCOUNT:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.packages-to-scan=com.luisda.fin_app_back.Controller
